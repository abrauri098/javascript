<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>IMC</title>
</head>
<body>
    <center>
    <div class="container p-4 bg-info mt-5 card">
        <h1 class="text-center">Calculadora de IMC</h1><br>
        
        <h5>INGRESE SU PESO (KG)</h5>
        <input type="number" class="form-control" id="input-peso" min="1" max="500" value="1">
        
        <h5>INGRESE SU ESTATURA (M)</h5>
        <input type="number" class="form-control" id="input-estatura" min="1" max="3" value="1">
        
        <h5>SELECCIONAR GENERO</h5>
        <select name="form-select" id="genero">
            <option value="masculino">MASCULINO</option>
            <option value="femenino">FEMENINO</option>
        </select>
        
        <button class="btn btn-primary" id="reset">RESET</button>
        <h2 class="text-center mt-5 bg-danger card" id="resultado">RESULTADO</h2><br>
        <img src="img/IMC.jpg" alt="">
    </div>
    </center>
    
    <script src="JS/IMCapp.js"></script>
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/sweetalert2.all.min.js"></script>
</body>
</html>
