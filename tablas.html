<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas Multiplicar</title></head>
<body>
    <center>
        <h1>Tablas de Multiplicar</h1>
        <table class="table table-striped table-hover mt-3">
            <tr>
                <td>
                    <input type="range" class="form-range w-75" id="num" min="1" max="100" value="1">
                    <span id="val" class="badge bg-dark fs-5">1</span>
                </td>
            </tr>
        </table>

        <button id="reset" class="btn btn-outline-danger w-100">
            <i class="bi bi-arrow-counterclockwise"></i> RESET
        </button>

        <table>
            <tr><td id="res1">1x1</td></tr>
            <tr><td id="res2">1x2</td></tr>
            <tr><td id="res3">1x3</td></tr>
            <tr><td id="res4">1x4</td></tr>
            <tr><td id="res5">1x5</td></tr>
            <tr><td id="res6">1x6</td></tr>
            <tr><td id="res7">1x7</td></tr>
            <tr><td id="res8">1x8</td></tr>
            <tr><td id="res9">1x9</td></tr>
            <tr><td id="res10">1x10</td></tr>
        </table>
    </center>
    <script src="JS/tablasapp.js"></script>
</body>
</html>
