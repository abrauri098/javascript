<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>Calculadora de Salario Neto</title>
</head>
<body onload="calcularSalarioNeto()">

<nav class="navbar bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="index.html">
                <img src="img/sonic1.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top rounded me-2">
                PRÁCTICAS JAVASCRIPT
            </a>
        </div>
    </nav>

<div class="container text-center my-4">
    <div class="display-2 mb-3"><h2>Salario Neto</h2></div>
    
    <table class="table table-bordered mb-4">
        <thead class="table-light">
            <tr>
                <th>Puesto</th>
                <th>Horas Trabaja</th>
                <th>Años de Antigüedad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <select id="puesto" class="form-select" onchange="calcularSalarioNeto()">
                        <option value="1">Gerente</option>
                        <option value="2">Secretaria</option>
                        <option value="3">Cajero</option>
                        <option value="4">Mesero</option>
                    </select>
                </td>
                <td>
                    <select id="horas" class="form-select" onchange="calcularSalarioNeto()">
                        <script>
                            for (var i = 0; i <= 50; i++) {
                                document.write("<option value='" + i + "'>" + i + "</option>");
                            }
                        </script>
                    </select>
                </td>
                <td>
                    <select id="anios" class="form-select" onchange="calcularSalarioNeto()">
                        <script>
                            for (var i = 0; i <= 40; i++) {
                                document.write("<option value='" + i + "'>" + i + "</option>");
                            }
                        </script>
                    </select>
                </td>
            </tr>
        </tbody>
    </table>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th colspan="2">PERCEPCIONES</th>
                <th colspan="2">DEDUCCIONES</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sueldo base</td>
                <td><span id="sueldoBase"></span></td>
                <td>ISR</td>
                <td><span id="ISR"></span></td>
            </tr>
            <tr>
                <td>Canasta Básica</td>
                <td><span id="canastaBasica"></span></td>
                <td>Servicios de Salud (3.5%)</td>
                <td><span id="ServicioSalud"></span></td>
            </tr>
            <tr>
                <td>Apoyos</td>
                <td><span id="apoyo"></span></td>
                <td>AFORE</td>
                <td><span id="afore"></span></td>
            </tr>
            <tr>
                <td>Antigüedad</td>
                <td><span id="antiguedad"></span></td>
                <td>Sindicato</td>
                <td><span id="sindicato"></span></td>
            </tr>
            <tr>
                <td>Estímulo</td>
                <td><span id="estimulo"></span></td>
                <td>Préstamo</td>
                <td><span id="prestamo"></span></td>
            </tr>
            <tr>
                <td>Vales de Despensa</td>
                <td><span id="valesDespensa"></span></td>
                <td>Fondo de Ahorro</td>
                <td><span id="fondoAhorro"></span></td>
            </tr>
            <tr class="table-info fw-bold">
                <td>TOTAL PERCEPCIONES</td>
                <td><span id="totalPercepciones"></span></td>
                <td>TOTAL DEDUCCIONES</td>
                <td><span id="totalDeducciones"></span></td>
            </tr>
            <tr class="table-success fw-bold fs-4">
                <td colspan="2">SALARIO NETO</td>
                <td colspan="2"><span id="salarioNeto"></span></td>
            </tr>
        </tbody>
    </table>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/sweetalert2.all.min.js"></script>
<script src="js/appSalarioNeto.js"></script>
</body>
</html>
