    <script>

    <script>
        function mensaje2(){
        Swal.fire({
        title: "Good",
        text: "haz sido rastreado",
        icon: "success"
        });
        }
    </script>

    <script>
        function mensaje3(){
        Swal.fire({
        title: "Do you want to save the changes?",
        showDenyButton: true,
        showCancelButton: true,
        confirmButtonText: "Save",
        denyButtonText: `Don't save`
}).then((result) => {
        if (result.isConfirmed) Swal.fire("Saved!", "", "success");
        else if (result.isDenied) Swal.fire("Changes are not saved", "", "info");
});
        }
    </script>

    <script>
        function mensaje4(){
        Swal.fire({
  title: "Are you sure?",
  text: "You won't be able to revert this!",
  icon: "warning",
  showCancelButton: true,
  confirmButtonColor: "#3085d6",
  cancelButtonColor: "#d33",
  confirmButtonText: "Yes, delete it!"
}).then((result) => {
  if (result.isConfirmed) Swal.fire({
    title: "Deleted!",
    text: "Your file has been deleted.",
    icon: "success"
  });
});
        }
    </script>

    <script>
        function mensaje5(){
        Swal.fire({
  title: "Sweet!",
  text: "Modal with a custom image.",
  imageUrl: "sonic1.jpg",
  imageWidth: 400,
  imageHeight: 200,
  imageAlt: "Custom image"
});
        }
    </script>

    <script>
        function mensaje6(){
        let timerInterval;
Swal.fire({
  title: "Auto close alert!",
  html: "I will close in <b></b> milliseconds.",
  timer: 2000,
  timerProgressBar: true,
  didOpen: () => {
    Swal.showLoading();
    const timer = Swal.getPopup().querySelector("b");
    timerInterval = setInterval(() => {
      timer.textContent = `${Swal.getTimerLeft()}`;
    }, 100);
  },
  willClose: () => {
    clearInterval(timerInterval);
  }
}).then((result) => {
  if (result.dismiss === Swal.DismissReason.timer) console.log("I was closed by the timer");
});
        }
        </script>

        <script>
        function mensaje7(){
            Swal.fire({
  title: "Submit your GitHub username",
  input: "text",
  inputAttributes: { autocapitalize: "off" },
  showCancelButton: true,
  confirmButtonText: "Look up",
  showLoaderOnConfirm: true,
  preConfirm: async (login) => {
    try {
      const githubUrl = `
        https://api.github.com/users/${login}
      `;
      const response = await fetch(githubUrl);
      if (!response.ok) return Swal.showValidationMessage(`
          ${JSON.stringify(await response.json())}
        `);
      return response.json();
    } catch (error) {
      Swal.showValidationMessage(`
        Request failed: ${error}
      `);
    }
  },
  allowOutsideClick: () => !Swal.isLoading()
}).then((result) => {
  if (result.isConfirmed) Swal.fire({
    title: `${result.value.login}'s avatar`,
    imageUrl: result.value.avatar_url
  });
});
        }
        </script>

        <script>
        function mensaje8(){
            Swal.fire({
  title: "Custom width, padding, color, background.",
  width: 600,
  padding: "3em",
  color: "#716add",
  background: "#fff url(/images/trees.png)",
  backdrop: `
    rgba(0,0,123,0.4)
    url("/images/nyan-cat.gif")
    left top
    no-repeat
  `
});
        }
        </script>

        <script>
        function mensaje9(){
            const swalWithBootstrapButtons = Swal.mixin({
  customClass: {
    confirmButton: "btn btn-success",
    cancelButton: "btn btn-danger"
  },
  buttonsStyling: false
});
swalWithBootstrapButtons.fire({
  title: "Are you sure?",
  text: "You won't be able to revert this!",
  icon: "warning",
  showCancelButton: true,
  confirmButtonText: "Yes, delete it!",
  cancelButtonText: "No, cancel!",
  reverseButtons: true
}).then((result) => {
  if (result.isConfirmed) swalWithBootstrapButtons.fire({
    title: "Deleted!",
    text: "Your file has been deleted.",
    icon: "success"
  });
  else if (result.dismiss === Swal.DismissReason.cancel)
  swalWithBootstrapButtons.fire({
    title: "Cancelled",
    text: "Your imaginary file is safe :)",
    icon: "error"
  });
});
        }
        </script>

        <script>
        function mensaje10(){
            Swal.fire({
  title: "Custom animation with Animate.css",
  showClass: { popup: `
      animate__animated
      animate__fadeInUp
      animate__faster
    ` },
  hideClass: { popup: `
      animate__animated
      animate__fadeOutDown
      animate__faster
    ` }
});
        }
        </script>

        <script>
        function mensaje11(){
            Swal.fire("SweetAlert2 is working!");
        }
        </script>
