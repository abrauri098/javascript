<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>TIENDITA</title>
</head>
<body>
    <nav class="navbar fg-2 bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/sonic1.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                TIENDITA
            </a>
        </div>
    </nav>
    
    <div class="container p-4 bg-inverse mt-5 card">
        <h1 class="text-center fg-black">TIENDITA</h1> <hr>
        <div class="d-flex justify-content-end">
        <button class="btn-solid btn-styled theme-primary w-25" data-bs-toggle="dialog" data-bs-target="#addProducto"><i class="bi bi-arrow-up-square"></i>Agregar</button>
        </div>
        <table class="table table-striped table-hover mt-3">
            <tr class="text-center">
                <td>PRODUCTO</td>
                <td>PRECIO</td>
                <td>ACTION</td>
            </tr>
            <tbody id="productos">
                
            </tbody>
        </table>

        </div>

        <dialog class="dialog" id="addProducto">
    <div class="dialog-header">
    <h1 class="dialog-title">AGREGAR PRODUCTO</h1>
    <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
        <h3>NOMBRE</h3>
        <input type="text" id="nombre" class="form-control"><br>
        <h3>PRECIO</h3>
        <input type="text" id="precio" class="form-control"><br>

    </div>
    <div class="dialog-footer">
    <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog"><i class="bi bi-dash-circle"></i>Cancelar</button>
    <button type="button" class="btn-solid theme-success" id="btnsave"><i class="bi bi-database-fill-add"></i>Guardar</button>
    </div>
</dialog>


<dialog class="dialog" id="editProducto">
    <div class="dialog-header">
    <h1 class="dialog-title">EDITAR PRODUCTO</h1>
    <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
        <h3>NOMBRE</h3>
        <input type="text" id="nombree" class="form-control"><br>
        <h3>PRECIO</h3>
        <input type="text" id="precioe" class="form-control"><br>

    </div>
    <div class="dialog-footer">
        <input type="hidden" id="posicion">
    <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog"><i class="bi bi-dash-circle"></i>Cancelar</button>
    <button type="button" class="btn-solid theme-success" id="btnEdit"><i class="bi bi-database-fill-add"></i>Guardar</button>
    </div>
</dialog>




    <script type="module" src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/sweetalert2.all.min.js"></script>
    <script src="JS/tiendita.js"></script>
</body>
</html>
