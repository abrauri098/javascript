<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="CSS/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
<title>TIENDITA</title>
</head>
<body>
    <nav class="navbar fg-2 bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
        <img src="img/sonic1.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
        TIENDITA
        </a>
    </div>
    </nav>

    <main class="d-flex" style="min-height: 90vh;">
    <aside class="bg-dark text-white border-end border-secondary p-0 shadow-sm" style="width: 240px; flex-shrink: 0;">
        <div class="bg-subtle-info p-3 border-bottom border-secondary bg-black">
        <h5 class="m-0 text-uppercase fw-bold text-center tracking-wide">MENÚ</h5>
        </div>
        <div class="list-group list-group-flush rounded-0">
        <a href="tiendita.html" class="list-group-item list-group-item-action bg-dark text-white p-3 border-bottom border-secondary">
        <i class="bi bi-box-seam me-2"></i> Productos
        </a>
        <a href="categorias.html" class="list-group-item list-group-item-action bg-dark text-white p-3 border-bottom border-secondary">
        <i class="bi bi-tags me-2"></i> Categoría
        </a>
        </div>
    </aside>

    <section class="flex-grow-1 p-4">
    <div class="container p-4 bg-inverse mt-5 card">
        <h1 class="text-center fg-black">TIENDITA</h1>
        <hr>
        <div class="d-flex justify-content-end">
        <button class="btn-solid btn-styled theme-primary w-25" data-bs-toggle="dialog" data-bs-target="#addProducto">
            <i class="bi bi-arrow-up-square"></i> Agregar
        </button>
        </div>

        <table class="table table-striped table-hover mt-3">
        <thead>
            <tr class="text-center">
                <td>PRODUCTO</td>
                <td>PRECIO</td>
                <td>CANTIDAD</td>
                <td>CATEGORIA</td>
                <td>IMAGEN</td>
                <td>ACTION</td>
            </tr>
            </thead>
                <tbody id="productos">

                </tbody>
            </table>
        </div>

        <dialog class="dialog" id="addProducto">
        <div class="dialog-header">
        <h1 class="dialog-title">AGREGAR PRODUCTO</h1>
        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
        <h3>NOMBRE</h3>
        <input type="text" id="nombre" class="form-control"><br>
        <h3>PRECIO</h3>
        <input type="number" id="precio" class="form-control"><br>
        <h3>CANTIDAD</h3>
        <input type="number" id="cantidad" class="form-control"><br>
        <h3>CATEGORÍA</h3>
        <select id="categoria" class="form-select"></select><br>
        <h3>IMAGEN</h3>
        <input type="file" id="imagen" accept="image/*" class="form-control">
        </div>
        <div class="dialog-footer">
        <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog">
            <i class="bi bi-dash-circle"></i> Cancelar
        </button>
        <button type="button" class="btn-solid theme-success" id="btnsave">
            <i class="bi bi-database-fill-add"></i> Guardar
        </button>
        </div>
    </dialog>

        <dialog class="dialog" id="editProducto">
        <div class="dialog-header">
            <h1 class="dialog-title">EDITAR PRODUCTO</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <h3>NOMBRE</h3>
            <input type="text" id="nombree" class="form-control"><br>
            <h3>PRECIO</h3>
            <input type="number" id="precioo" class="form-control"><br>
            <h3>CANTIDAD</h3>
            <input type="number" id="cantidade" class="form-control"><br>
            <h3>CATEGORÍA</h3>
            <select id="categoriae" class="form-select"></select><br>
        <h3>IMAGEN (Opcional si deseas cambiarla)</h3>
        <input type="file" id="imagene" accept="image/*" class="form-control">
        </div>
        <div class="dialog-footer">
            <input type="hidden" id="posicion">
            <button type="button" class="btn-solid theme-danger" data-bs-dismiss="dialog">
            <i class="bi bi-dash-circle"></i> Cancelar</button>
            <button type="button" class="btn-solid theme-success" id="btnEdit">
            <i class="bi bi-database-fill-add"></i> Guardar</button>
        </div>
    </dialog>
    </section>
    </main>

<script type="module" src="JS/bootstrap.bundle.min.js"></script>
<script src="JS/sweetalert2.all.min.js"></script>
<script src="JS/tiendita.js"></script>
</body>
</html>
