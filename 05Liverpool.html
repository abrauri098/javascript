<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <title>Liverpool</title>
    <style>
        #img img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
        }
    </style>
</head>
<body onload="calcular()" class="bg-dark text-white">
    
    <nav class="navbar bg-primary shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="index.html">
                <img src="img/sonic1.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top rounded me-2">
                PRÁCTICAS JAVASCRIPT
            </a>
        </div>
    </nav>
    
    <div class="container pb-5" style="max-width: 800px;">
                <div class="bg-white text-center py-3 mb-4 rounded">
            <img src="img/Liverpool/Logo.webp" alt="Liverpool" style="max-height: 60px; width: auto; object-fit: contain;">
            <h2 class="fw-bold mt-2 mb-0" style="color: #e10098; letter-spacing: 1px;">CREDIPOOL</h2>
        </div>
        <div class="d-flex align-items-center mb-3">
            <label class="fw-bold me-3 text-uppercase small">Producto</label>
            <select id="producto" class="form-select bg-dark text-white border-secondary w-auto shadow-none" onchange="calcular()">
                <option value="AireAcondicionado">Aire Acondicionado</option>
                <option value="FreidoraAire">Freidora de Aire</option>
                <option value="LaptopGamer">Laptop Gamer</option>
                <option value="Moto">Moto</option>
                <option value="Smartphone">Smartphone</option>
                <option value="Xbox">Consola Xbox</option>
            </select>
        </div>
        <div class="border border-secondary rounded p-3 mb-4 text-center">
            <div id="img" class="mb-3 d-flex justify-content-center align-items-center" style="min-height: 200px;">
            </div>
            <div id="precio" class="fw-bold fs-4 text-white">Precio: $ 0.00 MXN</div>
        </div>
        <div class="mb-4">
            <label class="fw-bold text-uppercase small mb-3 d-block">Plazo</label>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="plazo" id="uno" onchange="calcular()" checked>
                <label class="form-check-label" for="uno">6 Meses <span class="text-secondary">(+10%)</span></label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="plazo" id="dos" onchange="calcular()">
                <label class="form-check-label" for="dos">12 Meses <span class="text-secondary">(+15%)</span></label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="plazo" id="tres" onchange="calcular()">
                <label class="form-check-label" for="tres">18 Meses <span class="text-secondary">(+20%)</span></label>
            </div>
        </div>
        <div class="mb-4">
            <label class="fw-bold text-uppercase small mb-2 d-block">Cantidad</label>
            <input type="number" id="cantidad" class="form-control bg-dark text-white border-secondary shadow-none" style="max-width: 150px;" value="1" min="1" max="10" onchange="calcular()">
        </div>

        <div class="p-3 rounded mt-4" style="background-color: black; border-left: 5px solid #e10098;">
            <div id="contado" class="text-dark fw-semibold mb-2 fs-5">Precio de Contado: $ 0.00 MXN</div>
            <div id="credito" class="text-dark fw-semibold mb-2 fs-5">Precio a Credito: $ 0.00 MXN</div>
            <hr class="border-secondary opacity-50">
            <div id="abono" class="fw-bold fs-3" style="color: #e10098;">Abono Mensual: $ 0.00 MXN</div>
        </div>

    </div>

    <script src="JS/05appLiverpool.js"></script>
    <script src="JS/bootstrap.bundle.min.js"></script>
    <script src="JS/sweetalert2.all.min.js"></script>
</body>
</html>
